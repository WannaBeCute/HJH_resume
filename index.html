<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人简历">
  <meta name="robots" content="noindex, nofollow">
  <title>个人简历</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <!-- 简历样式：静态文件（只含排版，不含任何个人资料） -->
  <link rel="stylesheet" href="assets/css/resume.css">
  <style>
    /* ===== 锁屏样式：放在 resume.css 之后，用于覆盖它的全局底色 ===== */
    /* 背景直接用 default.png：不再叠紫色蒙版、不做模糊，原图什么样就什么样。
       前面的 #1b1b23 只是图片没加载出来时的兜底底色。 */
    body.locked {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: #1b1b23 url('assets/img/default.png') center center / cover no-repeat fixed;
    }
    .card {
      width: 100%; max-width: 560px; background: #fff;
      border-radius: 20px; padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .lock-card { max-width: 400px; text-align: center; }
    .lock-ico {
      width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 8px 20px rgba(102,126,234,.4);
    }
    .lock-title { margin: 0; font-size: 24px; font-weight: 700; color: #333; }
    .lock-sub { color: #8892b0; font-size: 13px; line-height: 1.7; margin: 8px 0 22px; }
    .lock-form input {
      width: 100%; padding: 13px 16px; font-size: 16px;
      border: 1.5px solid #dfe3f0; border-radius: 12px; outline: none; color: #333;
      transition: border-color .2s, box-shadow .2s;
    }
    .lock-form input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.18); }
    .lock-form button {
      width: 100%; margin-top: 12px; padding: 13px 16px; font-size: 16px; font-weight: bold;
      color: #fff; letter-spacing: 6px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform .1s, box-shadow .2s, opacity .2s;
    }
    .lock-form button:hover { box-shadow: 0 8px 20px rgba(102,126,234,.4); }
    .lock-form button:active { transform: translateY(1px); }
    .lock-form button:disabled { opacity: .6; cursor: wait; }
    .lock-msg { min-height: 22px; margin: 14px 0 0; font-size: 13px; color: #e2574c; }
    .lock-foot { margin: 4px 0 0; font-size: 12px; color: #c0c5d4; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    .shake { animation: shake .45s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .reveal { animation: fadeUp .5s ease; }
    /* ===== 解锁后的浮动操作组：个人简介入口 + 锁定 ===== */
    .page-actions {
      position: fixed; right: 18px; bottom: 18px; z-index: 99;
      display: flex; gap: 10px; align-items: center;
    }
    .action-btn {
      padding: 9px 18px; font-size: 13px; font-family: inherit; line-height: 1.4;
      border: none; border-radius: 999px; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      transition: transform .1s, box-shadow .2s, background .2s;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }
    /* 个人简介入口：做成醒目的品牌色胶囊，一解锁就能看见 */
    .action-intro {
      color: #fff; font-weight: bold;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .action-intro:hover { box-shadow: 0 8px 20px rgba(102,126,234,.5); }
    .action-intro::after { content: " →"; }
    .action-lock { color: #fff; background: rgba(31,94,168,.85); }
    .action-lock:hover { background: rgba(31,94,168,1); }
    @media print { .page-actions { display: none; } }
  </style>
</head>
<body class="locked">

  <!-- 锁屏 -->
  <div class="card lock-card" id="lockCard">
    <div class="lock-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none"
           stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1 class="lock-title">个人简历</h1>
    <p class="lock-sub">本页简历已加密保存，<br>请输入访问密码进行解密查看。</p>

    <form id="loginForm" class="lock-form" novalidate autocomplete="off">
      <input id="pwInput" type="password" placeholder="请输入访问密码"
             autocomplete="off" spellcheck="false" autocapitalize="off" />
      <button id="enterBtn" type="submit">解 锁</button>
    </form>
    <p class="lock-msg" id="msgLine"></p>
    <p class="lock-foot">忘记密码请联系作者</p>
  </div>

  <noscript>
    <div class="card"><p>本页需要启用 JavaScript 才能解密显示。</p></div>
  </noscript>

  <!-- 解密后的简历正文（初始为空，解密成功后填充） -->
  <main id="resumeHost" hidden></main>

      var lockCard = document.getElementById('lockCard');
      var host = document.getElementById('resumeHost');
      var form = document.getElementById('loginForm');
      var input = document.getElementById('pwInput');
      var btn = document.getElementById('enterBtn');
      var msgLine = document.getElementById('msgLine');

      var busy = false;

      function showResume(html) {
        host.innerHTML = html;
        host.hidden = false;
        host.classList.add("reveal");
        document.body.classList.remove("locked");
        lockCard.style.display = "none";
        document.title = "个人简历";
        window.scrollTo(0, 0);

        // 右下角浮动操作组：个人简介入口 + 锁定
        var actions = document.createElement('div');
        actions.className = "page-actions";

        // 入口：跳到 intro.html 看个人简介（同一密码，那边需再输一次）
        var btnIntro = document.createElement('a');
        btnIntro.className = "action-btn action-intro";
        btnIntro.href = "intro.html";
        btnIntro.textContent = "个人简介";
        btnIntro.title = "查看个人简介";
        actions.appendChild(btnIntro);

        // 锁定：一键回到锁屏（公共电脑上临时离开时用）
        var btnLock = document.createElement('button');
        btnLock.className = "action-btn action-lock";
        btnLock.type = "button";
        btnLock.textContent = "锁定";
        btnLock.title = "重新隐藏简历内容";
        btnLock.addEventListener("click", function () { location.reload(); });
        actions.appendChild(btnLock);

        document.body.appendChild(actions);
      }

      function unlock(password) {
        busy = true;
        btn.disabled = true;
        msgLine.textContent = "";
        // 让出一帧，先刷新按钮禁用态
        setTimeout(function () {
          var data;
          try {
            var plain = GditCrypto.decrypt(payload.c, password, payload.salt, payload.iter);
            data = JSON.parse(plain);
          } catch (e) {
            busy = false;
            btn.disabled = false;
            input.value = "";
            input.focus();
            lockCard.classList.remove("shake");
            void lockCard.offsetWidth; // 重新触发抖动动画
            lockCard.classList.add("shake");
            msgLine.textContent = "密码错误，请重试";
            return;
          }
          showResume(data.html);
        }, 30);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (busy) return;
        var pw = input.value;
        if (!pw) { input.focus(); return; }
        unlock(pw);
      });

      input.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { input.value = ""; }
      });

      // ===== 从 URL 提取密码并自动填入（仍需手动点「解锁」）=====
      // 用法：网址末尾加 ?pw=密码 或 #pw=密码
      var raw = (location.search || "") + (location.hash || "");
      var m = raw.match(/[?&#]pw=([^&#]+)/i);
      var token = null;
      if (m) { try { token = decodeURIComponent(m[1]); } catch (e) { token = null; } }
      if (token && token.length) {
        input.value = token;
        // 用完立刻从地址栏抹掉，避免密码残留在屏幕或历史记录里
        try {
          var clean = new URL(location.href);
          clean.searchParams.delete("pw");
          if (/^pw=/i.test(clean.hash.slice(1))) clean.hash = "";
          history.replaceState(null, "", clean.toString());
        } catch (e) { /* 忽略 */ }
        input.style.borderColor = "#667eea";
        input.style.boxShadow = "0 0 0 3px rgba(102,126,234,0.25)";
        input.focus();
        input.select();
      } else {
        input.focus();
      }

      input.addEventListener("input", function () {
        if (input.style.borderColor === "#667eea") {
          input.style.borderColor = "";
          input.style.boxShadow = "";
        }
      });
    })();
  </script>
</body>
</html>
