      });

      /* ================================================================
         解锁流程（锁屏默认 hidden，只在确实需要密码时才显示）
         1) 会话里有密码 -> 静默解密；成功就直接进正文，全程不出现锁屏
         2) 静默解密失败（比如重新 build 换了密码）-> 丢掉旧密码，显示锁屏
         3) 地址栏带 ?pw= / #pw= -> 显示锁屏并预填，等用户点解锁
         4) 什么都没有 -> 显示锁屏
         ================================================================ */

      function openGate() {
        gate.hidden = false;
      }

      /* ---- 1) 本次会话已解锁过：直接进正文，不再弹锁屏 ---- */
      var saved = readSession();
      var unlocked = false;
      if (saved) {
        setBusy(true);
        unlocked = attempt(saved, true);
        setBusy(false);
        if (!unlocked) clearSession(); // 旧密码（比如重新 build 换了密码），丢掉重来
      }

      /* ---- 2) 还没解锁：这时候才需要锁屏 ---- */
      if (!unlocked) {
        // 先把 ?pw= / #pw= 取出来并清掉地址栏，再显示锁屏，避免闪一下空输入框
        var fromUrl = takePwFromUrl();
        openGate();
        if (fromUrl) {
          input.value = fromUrl;
          input.style.borderColor = "#a8c8f5";
          input.style.boxShadow = "0 0 0 3px rgba(168,200,245,0.25)";
          input.focus();
          input.select();
        } else {
          input.focus();
        }
        input.addEventListener("input", function () {
          if (input.style.borderColor === "rgb(168, 200, 245)") {
            input.style.borderColor = "";
            input.style.boxShadow = "";
          }
        });
      }

      /* ---- 3) 锁定：清掉会话密码，回到锁屏 ---- */
      var lockBtn = document.getElementById("lockBtn");
      if (lockBtn) lockBtn.addEventListener("click", function () {
        clearSession();
        location.reload();
      });
    })();
  </script>
</body>
</html>
