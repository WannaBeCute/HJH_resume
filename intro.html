<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人简介</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 背景图直接铺在 body 上：不叠紫色蒙版、不做模糊，原图什么样就什么样。
         图片路径由 build.js 的「背景路径占位符」注入：
           单文件版 个人简介.html   -> default.png（与页面同级）
           站点内页 main/intro.html -> assets/img/default.png
         前面的 #1b1b23 只是图片没加载出来时的兜底底色。 */
      background: #1b1b23 url('assets/img/default.png') center center / cover no-repeat fixed;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      color: #333;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: #8892b0;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .info-item { display: flex; padding: 14px 0; border-bottom: 1px solid #f0f0f5; }
    .info-item:last-child { border-bottom: none; }
    .label { flex: 0 0 80px; font-weight: bold; color: #555; }
    .value { color: #222; flex: 1; line-height: 1.6; }

    .hobbies { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .tag {
      display: inline-block;
      background: #eef0ff; color: #667eea;
      padding: 6px 14px; border-radius: 20px; font-size: 13px;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    a.tag { cursor: pointer; }
    a.tag:hover {
      background: #dfe4ff;
      transform: translateY(-1px);
    }
    a.tag:active { transform: translateY(0); }

    .school-link {
      color: #d32f2f;
      font-weight: 600;
      text-decoration: none;
    }
    .school-link:hover { text-decoration: underline; }

    /* ---------- 锁屏 ---------- */
    .lock-card { max-width: 400px; text-align: center; }

    .lock-ico {
      width: 84px; height: 84px; margin: 0 auto 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .lock-title { font-size: 24px; }
    .lock-sub { color: #8892b0; font-size: 13px; line-height: 1.7; margin: 8px 0 22px; }

    .lock-form input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      border: 1.5px solid #dfe3f0;
      border-radius: 12px;
      outline: none;
      color: #333;
      transition: border-color .2s, box-shadow .2s;
    }
    .lock-form input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18);
    }
    .lock-form button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s, opacity .2s;
    }
    .lock-form button:hover { box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
    .lock-form button:active { transform: translateY(1px); }
    .lock-form button:disabled { opacity: .6; cursor: wait; }

    .lock-msg { min-height: 22px; margin-top: 14px; font-size: 13px; color: #e2574c; }
    .lock-foot { margin-top: 4px; font-size: 12px; color: #c0c5d4; }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    .shake { animation: shake .45s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: fadeUp .5s ease; }

    /* ---------- 解锁后的「返回简历」入口 ----------
       只在站点内页 main/intro.html 出现：由 build.js 的「返回入口占位符」
       决定注入与否（单文件版替换为空字符串），故这里留着样式也无副作用。 */
    .back-link {
      position: fixed; right: 18px; bottom: 18px; z-index: 99;
      padding: 9px 18px; font-size: 13px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 999px; text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
      transition: transform .1s, box-shadow .2s;
    }
    .back-link:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(102, 126, 234, .5); }
    .back-link:active { transform: translateY(0); }
    @media print { .back-link { display: none; } }
  </style>
</head>
<body>

  <!-- 锁屏 -->
  <div class="card lock-card" id="lockCard">
    <div class="lock-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none"
           stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1 class="lock-title">个人简介</h1>
    <p class="lock-sub">本页资料已加密保存，<br>请输入访问密码进行解密查看。</p>

    <form id="loginForm" class="lock-form" novalidate autocomplete="off">
      <input id="pwInput" type="password" placeholder="请输入访问密码"
             autocomplete="off" spellcheck="false" autocapitalize="off" />
      <button id="enterBtn" type="submit">解 锁</button>
    </form>
    <p class="lock-msg" id="msgLine"></p>
    <p class="lock-foot">忘记密码请联系作者</p>
  </div>

  <!-- 解密后的正文（初始为空，解密成功后填充） -->
  <div class="card" id="profileCard" hidden></div>

  <!-- 「返回简历」入口占位符：只有站点内页 main/intro.html 会注入这个元素，

  <a class="back-link" id="backLink" href="index.html" hidden>← 返回简历</a>
