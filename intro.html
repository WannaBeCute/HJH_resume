<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人简历">
  <meta name="robots" content="noindex, nofollow">
  <title>个人简历</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <!-- 简历样式：静态文件（只含排版，不含任何个人资料） -->
  <link rel="stylesheet" href="assets/css/resume.css">
  <style>
    /* ===== 锁屏样式：放在 resume.css 之后，用于覆盖它的全局底色 ===== */
    /* 背景直接用 default.png 并模糊 10px（见下方 body::before）。
       前面的 #1b1b23 只是图片没加载出来时的兜底底色。 */
    body.locked {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: #1b1b23;
    }
    /* 背景图：模糊 10px（与卡片页一致）。用 fixed 的 ::before 承载，
       避免 filter:blur 把正文也糊掉，inset 外扩 40px 补偿边缘露白。 */
    body::before {
      content: '';
      position: fixed;
      inset: -40px;
      z-index: -1;
      background: #1b1b23 url('assets/img/default.png') center center / cover no-repeat;
      filter: blur(10px);
      pointer-events: none;
    }
    .card {
      width: 100%; max-width: 560px; background: #fff;
      border-radius: 20px; padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .lock-card { max-width: 400px; text-align: center; }
    .lock-ico {
      width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 8px 20px rgba(102,126,234,.4);
    }
    .lock-title { margin: 0; font-size: 24px; font-weight: 700; color: #333; }
    .lock-sub { color: #8892b0; font-size: 13px; line-height: 1.7; margin: 8px 0 22px; }
    .lock-form input {
      width: 100%; padding: 13px 16px; font-size: 16px;
      border: 1.5px solid #dfe3f0; border-radius: 12px; outline: none; color: #333;
      transition: border-color .2s, box-shadow .2s;
    }
    .lock-form input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.18); }
    .lock-form button {
      width: 100%; margin-top: 12px; padding: 13px 16px; font-size: 16px; font-weight: bold;
      color: #fff; letter-spacing: 6px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px; cursor: pointer;
      transition: transform .1s, box-shadow .2s, opacity .2s;
    }
    .lock-form button:hover { box-shadow: 0 8px 20px rgba(102,126,234,.4); }
    .lock-form button:active { transform: translateY(1px); }
    .lock-form button:disabled { opacity: .6; cursor: wait; }
    .lock-msg { min-height: 22px; margin: 14px 0 0; font-size: 13px; color: #e2574c; }
    .lock-foot { margin: 4px 0 0; font-size: 12px; color: #c0c5d4; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    .shake { animation: shake .45s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .reveal { animation: fadeUp .5s ease; }
    /* ===== 解锁后的浮动操作组：跳另一页 + 锁定 ===== */
    .page-actions {
      position: fixed; right: 18px; bottom: 18px; z-index: 99;
      display: flex; gap: 10px; align-items: center;
    }
    .action-btn {
      padding: 9px 18px; font-size: 13px; font-family: inherit; line-height: 1.4;
      border: none; border-radius: 999px; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      transition: transform .1s, box-shadow .2s, background .2s;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }
    .action-nav { color: #fff; font-weight: bold;
      background: linear-gradient(135deg, #667eea, #764ba2); }
    .action-nav:hover { box-shadow: 0 8px 20px rgba(102,126,234,.5); }
    .action-lock { color: #fff; background: rgba(31,94,168,.85); }
    .action-lock:hover { background: rgba(31,94,168,1); }
    @media print { .page-actions { display: none; } }
  </style>
</head>
<body class="locked">

  <!-- 锁屏 -->
  <div class="card lock-card" id="lockCard">
    <div class="lock-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none"
           stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1 class="lock-title">个人简历</h1>
    <p class="lock-sub">本页简历已加密保存，<br>请输入访问密码进行解密查看。</p>

    <form id="loginForm" class="lock-form" novalidate autocomplete="off">
      <input id="pwInput" type="password" placeholder="请输入访问密码"
             autocomplete="off" spellcheck="false" autocapitalize="off" />
      <button id="enterBtn" type="submit">解 锁</button>
    </form>
    <p class="lock-msg" id="msgLine"></p>
    <p class="lock-foot">忘记密码请联系作者</p>
  </div>

  <noscript>
    <div class="card"><p>本页需要启用 JavaScript 才能解密显示。</p></div>
  </noscript>

  <!-- 解密后的简历正文（初始为空，解密成功后填充） -->
  <main id="resumeHost" hidden></main>

  <!-- 解锁后才显示的操作组：跳另一页 + 锁定 -->
  <div class="page-actions" id="pageActions" hidden>
    <a class="action-btn action-nav" id="navBtn" href="index.html" title="查看个人简介">← 个人简介</a>
    <button class="action-btn action-lock" id="lockBtn" type="button" title="重新隐藏本页内容">锁定</button>
  </div>

      var SESSION_KEY = 'gdit_unlock_v1';

      function readSession() {
        try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; }
      }
      function saveSession(pw) {
        try { sessionStorage.setItem(SESSION_KEY, pw); } catch (e) { /* 隐私模式静默忽略 */ }
      }
      function clearSession() {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* 忽略 */ }
      }

      /** 从地址栏取 ?pw= / #pw=，并立刻把密码从地址栏抹掉 */
      function takePwFromUrl() {
        var raw = (location.search || "") + (location.hash || "");
        var m = raw.match(/[?&#]pw=([^&#]+)/i);
        if (!m) return "";
        var pw = "";
        try { pw = decodeURIComponent(m[1]); } catch (e) { pw = ""; }
        try {
          var clean = new URL(location.href);
          clean.searchParams.delete("pw");
          if (/^pw=/i.test(clean.hash.slice(1))) clean.hash = '';
          history.replaceState(null, "", clean.toString());
        } catch (e) { /* 忽略 */ }
        return pw;
      }

      /** 解锁成功后打开右下角浮动操作组（跳另一页 + 锁定）*/

      }

      /** 锁定：清掉会话密码，回到锁屏（公共电脑临时离开时用）*/
      function lockNow() {
        clearSession();
        location.reload();
      }


      function render(plain) {

        host.classList.add("reveal");
        document.body.classList.remove("locked");
        lockCard.style.display = "none";
        document.title = "个人简历";
        showActions();
        window.scrollTo(0, 0);
      }

      function shake() {
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth; // 重新触发抖动动画
        lockCard.classList.add("shake");
      }

      /** 尝试解密并渲染。silent=true 时不提示错误（用于自动解锁）。返回是否成功。 */
      function attempt(pw, silent) {
        var plain;
        try {
          plain = GditCrypto.decrypt(payload.c, pw, payload.salt, payload.iter);
        } catch (e) { plain = null; }
        if (plain === null) {
          if (!silent) {
            shake();
            msgLine.textContent = "密码错误，请重试";
          }
          return false;
        }
        var data;
        try { data = JSON.parse(plain); } catch (e) { data = null; }
        if (!data || typeof data.html !== "string") {
          if (!silent) { shake(); msgLine.textContent = "内容损坏，无法解密"; }
          return false;
        }
        saveSession(pw);
        render(data.html);
        return true;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (busy) return;
        var pw = input.value;
        if (!pw) { input.focus(); return; }
        busy = true;
        btn.disabled = true;
        msgLine.textContent = "";
        // 让出一帧，先刷新按钮禁用态
        setTimeout(function () {
          attempt(pw, false);
          busy = false;
          btn.disabled = false;
          if (document.body.classList.contains("locked") && input.value) {
            input.value = ""; input.focus();
          }
        }, 30);
      });

      input.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { input.value = ""; }
      });

      // ===== 1) 会话内已解锁过：直接进正文，不再弹锁屏 =====
      var saved = readSession();
      if (saved && attempt(saved, true)) {
        // 已在正文页，收工
      } else if (saved) {
        clearSession(); // 存的是旧密码（比如重新 build 换了密码），丢掉
      }

      // ===== 2) 地址栏 ?pw= / #pw=：填进输入框，等用户点解锁 =====
      var fromUrl = takePwFromUrl();
      if (fromUrl) {
        input.value = fromUrl;
        input.style.borderColor = "#667eea";
        input.style.boxShadow = "0 0 0 3px rgba(102,126,234,0.25)";
        input.focus();
        input.select();
      } else {
        input.focus();
      }

      input.addEventListener("input", function () {
        if (input.style.borderColor === "#667eea") {
          input.style.borderColor = "";
          input.style.boxShadow = "";
        }
      });

      var lockBtn = document.getElementById("lockBtn");
      if (lockBtn) lockBtn.addEventListener("click", lockNow);
    })();
  </script>
</body>
</html>
