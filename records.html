    (function () {
      'use strict';

      var payloadData = payload;

      var gate     = document.getElementById('gate');
      var host     = document.getElementById('pageHost');
      var form     = document.getElementById('gateForm');
      var input    = document.getElementById('pwInput');
      var btn      = document.getElementById('gateBtn');
      var msgLine  = document.getElementById('gateMsg');
      var actions  = document.getElementById('pageActions');
      var busy = false;

      /* ===== 站点级公共逻辑（六页共用）：会话免二次密码 + ?pw= 自动填入 ===== */
      var SESSION_KEY = 'gdit_unlock_v3';

      function readSession() {
        try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch (e) { return ""; }
      }
      function saveSession(pw) {
        try { sessionStorage.setItem(SESSION_KEY, pw); } catch (e) { /* 隐私模式静默忽略 */ }
      }
      function clearSession() {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* 忽略 */ }
      }

      /** 从地址栏取 ?pw= / #pw=，并立刻把密码从地址栏抹掉 */
      function takePwFromUrl() {
        var raw = (location.search || "") + (location.hash || "");
        var m = raw.match(/[?&#]pw=([^&#]+)/i);
        if (!m) return "";
        var pw = "";
        try { pw = decodeURIComponent(m[1]); } catch (e) { pw = ""; }
        try {
          var clean = new URL(location.href);
          clean.searchParams.delete("pw");
          if (/^pw=/i.test(clean.hash.slice(1))) clean.hash = '';
          history.replaceState(null, "", clean.toString());
        } catch (e) { /* 忽略 */ }
        return pw;
      }

      /** 解锁：关掉门禁，显示正文与浮动操作组 */
      function unlock(html) {
        host.innerHTML = html;
        host.hidden = false;
        host.classList.add("reveal");
        gate.hidden = true;
        document.body.classList.add("is-unlocked");
        document.documentElement.classList.add("is-unlocked");
        if (actions) actions.hidden = false;
        window.scrollTo(0, 0);
      }

      function shake() {
        gate.classList.remove("shake");
        void gate.offsetWidth; // 重新触发抖动动画
        gate.classList.add("shake");
      }

      /** 门禁忙碌态：解密是同步重计算，先禁用交互避免卡片 */
      function setBusy(isBusy) {
        busy = isBusy;
        btn.disabled = isBusy;
        if (window.gditSetThemeToggleBusy) window.gditSetThemeToggleBusy(isBusy);
      }

      /** 尝试解密并渲染。silent=true 时不提示错误（用于自动解锁）。返回是否成功。 */
      function attempt(pw, silent) {
        var plain;
        try {
          plain = GditCrypto.decrypt(payloadData.c, pw, payloadData.salt, payloadData.iter);
        } catch (e) { plain = null; }
        if (plain === null) {
          if (!silent) { shake(); msgLine.textContent = "密码错误，请重试"; }
          return false;
        }
        var data;
        try { data = JSON.parse(plain); } catch (e) { data = null; }
        if (!data || typeof data.html !== "string") {
          if (!silent) { shake(); msgLine.textContent = "内容损坏，无法解密"; }
          return false;
        }
        saveSession(pw);
        unlock(data.html);
        return true;
      }

      /* ---- 手动解锁 ---- */
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (busy) return;
        var pw = input.value;
        if (!pw) { input.focus(); return; }
        msgLine.textContent = "";
        setBusy(true);
        // 让出一帧，先刷新按钮的禁用态再开始重计算
        setTimeout(function () {
          attempt(pw, false);
          setBusy(false);
          if (!gate.hidden && input.value) { input.value = ""; input.focus(); }
        }, 30);
      });

      input.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { input.value = ""; }
      });

      /* ---- 1) 本次会话已解锁过：直接进正文，不再弹锁屏 ---- */
      var saved = readSession();
      if (saved) {
        setBusy(true);
        var ok = attempt(saved, true);
        setBusy(false);
        if (!ok) clearSession(); // 存的是旧密码（比如重新 build 换了密码），丢掉重来
      }

      /* ---- 2) 地址栏 ?pw= / #pw=：填进输入框，等用户点解锁 ---- */
      if (!gate.hidden) {
        var fromUrl = takePwFromUrl();
        if (fromUrl) {
          input.value = fromUrl;
          input.style.borderColor = "#8fb6ec";
          input.style.boxShadow = "0 0 0 3px rgba(143,182,236,0.25)";
          input.focus();
          input.select();
        } else {
          input.focus();
        }
        input.addEventListener("input", function () {
          if (input.style.borderColor === "rgb(143, 182, 236)") {
            input.style.borderColor = "";
            input.style.boxShadow = "";
          }
        });
      }

      /* ---- 3) 锁定：清掉会话密码，回到锁屏 ---- */
      var lockBtn = document.getElementById("lockBtn");
      if (lockBtn) lockBtn.addEventListener("click", function () {
        clearSession();
        location.reload();
      });
    })();
  </script>
